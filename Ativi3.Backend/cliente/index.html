<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas de Notas</title>
</head>
<body>
     <center>
        <form action="http://127.0.0.1:3000" method="post">
            <h1>Cadastro de Notas</h1>

            <input type="number" placeholder="Identificação" name="id" required>
            <br><br>

            <input type="text" placeholder="Nome do Aluno " name="nome" required>
            <br><br>

            <input type="number" placeholder="Nota1: " name="nota1" required>
            <br><br>

            <input type="number" placeholder="Nota2: " name="nota2" required>
            <br><br>

            <input type="number" placeholder="Nota3: " name="nota3" required>
            <br><br>

            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
