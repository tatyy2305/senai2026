    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-container">
        <h1>Bem-vindo!</h1>
        <p class="subtitulo">Entre para acessar</p>

        <form id="formLogin">
            <div class="campo">
                <label for="usuario">Usuário: </label>
                <input type="text" id="usuario" placeholder="Digite seu usuário" required>
            </div>

            <div class="campo">
                <label for="senha">Senha: </label>
                <input type="password" id="senha" placeholder="Digite sua Senha" required>
            </div>

        

            <button type="submit" class="botao-principal">Entrar no Sistema</button>
        </form>

        <p class="rodape">Sistema de Login</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
